<div class="page-wrapper">

  <!-- HERO / LANDING -->
  <app-header [profile]="profile"></app-header>

  <!-- TABS NAVIGATION -->
  <app-tabs-nav 
    [activeTab]="activeTab()" 
    (tabChange)="setTab($event)">
  </app-tabs-nav>

  <!-- TAB CONTENT -->
  <main class="tab-content">

    @if (activeTab() === 'overzicht') {
      <app-activity-overview [activities]="allActivities"></app-activity-overview>
    }

    @if (activeTab() === 'selectie') {
      <app-activity-selection [activities]="detailedActivities"></app-activity-selection>
    }

    @if (activeTab() === 'eindreflectie') {
      <app-reflection></app-reflection>
    }

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Kevin Jespers &nbsp;&middot;&nbsp; iTalent Portfolio</p>
  </footer>

</div>
